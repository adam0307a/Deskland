<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>
    <radialGradient id="bhGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="28%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="31%" stop-color="#fff3db" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#e39d54" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#8c4b2b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8c4b2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diskGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffdca8" stop-opacity="0.05"/>
      <stop offset="22%" stop-color="#fff4df" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#e89a4e" stop-opacity="0.45"/>
      <stop offset="82%" stop-color="#9e4822" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#9e4822" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4dc" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#9cb8e8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#9cb8e8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Global Icon Orbits Around Central Black Hole -->
  <g transform="translate(400, 225) rotate(-10)">
    <ellipse cx="0" cy="0" rx="185" ry="88" fill="none" stroke="#d9b38c" stroke-opacity="0.07" stroke-dasharray="4 6" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="285" ry="136" fill="none" stroke="#9ab4dc" stroke-opacity="0.06" stroke-dasharray="3 8" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="365" ry="174" fill="none" stroke="#9ab4dc" stroke-opacity="0.045" stroke-width="1"/>
  </g>
  <!-- Supermassive Black Hole (Gargantua) -->
  <g transform="translate(400, 225) rotate(-14)">
    <!-- Gravitational Lensing Upper & Lower Arcs -->
    <ellipse cx="0" cy="-6" rx="54" ry="44" fill="none" stroke="#f5c994" stroke-opacity="0.32" stroke-width="3.5"/>
    <ellipse cx="0" cy="6" rx="50" ry="38" fill="none" stroke="#d48748" stroke-opacity="0.2" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="86" fill="url(#bhGlow)"/>
    <!-- Accretion Disk -->
    <ellipse cx="0" cy="0" rx="118" ry="26" fill="none" stroke="url(#diskGrad)" stroke-width="9"/>
    <ellipse cx="0" cy="0" rx="88" ry="18" fill="none" stroke="#fff6e6" stroke-opacity="0.65" stroke-width="2.2"/>
    <!-- Event Horizon & Photon Ring -->
    <circle cx="0" cy="0" r="25" fill="#000000" stroke="#ffeed1" stroke-opacity="0.9" stroke-width="1.3"/>
  </g>
  <!-- Orbiting Icon System 1 -->
  <g transform="translate(165, 160) rotate(-18)">
    <ellipse cx="0" cy="0" rx="34" ry="19" fill="none" stroke="#a6c2ee" stroke-opacity="0.12" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="58" ry="32" fill="none" stroke="#a6c2ee" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="0" cy="0" r="16" fill="url(#starGlow)"/>
    <circle cx="0" cy="0" r="2.6" fill="#fff6e5"/>
    <circle cx="29" cy="9" r="2.3" fill="#89a7c7"/>
    <circle cx="-44" cy="-19" r="3.2" fill="#c7a27c"/>
  </g>
  <!-- Orbiting Icon System 2 -->
  <g transform="translate(625, 185) rotate(14)">
    <ellipse cx="0" cy="0" rx="38" ry="21" fill="none" stroke="#b8c9e8" stroke-opacity="0.11" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="66" ry="37" fill="none" stroke="#b8c9e8" stroke-opacity="0.075" stroke-width="1"/>
    <circle cx="0" cy="0" r="18" fill="url(#starGlow)"/>
    <circle cx="0" cy="0" r="2.9" fill="#eef4ff"/>
    <circle cx="-32" cy="11" r="2.5" fill="#9fb6d4"/>
    <circle cx="52" cy="23" r="3.4" fill="#b88c6e"/>
  </g>
  <!-- Orbiting Icon System 3 -->
  <g transform="translate(275, 340) rotate(-8)">
    <ellipse cx="0" cy="0" rx="32" ry="18" fill="none" stroke="#d9c3a8" stroke-opacity="0.1" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="54" ry="30" fill="none" stroke="#d9c3a8" stroke-opacity="0.07" stroke-width="1"/>
    <circle cx="0" cy="0" r="15" fill="url(#starGlow)"/>
    <circle cx="0" cy="0" r="2.4" fill="#ffefd6"/>
    <circle cx="24" cy="-11" r="2.2" fill="#c99e78"/>
    <circle cx="-41" cy="18" r="2.9" fill="#829ab8"/>
  </g>
</svg>