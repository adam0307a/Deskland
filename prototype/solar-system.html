          if (planet.depthZ < 0) {
            const pStagger = isSpawning
              ? smoothstep(0.48 + p * 0.07, 0.78 + p * 0.07, sys.spawnProgress)
              : 1.0;
            drawPlanet(sys, planet, sys.opacity * pStagger);
          }
        }

        const pulse = 1.0 + Math.sin(elapsedTime * sys.pulseSpeed + sys.pulsePhase) * 0.07;

        if (sys.isMiniBlackHole && blackHoleHaloSprite) {
          // Special mini black hole core for Recycle Bin / Trash icon
          const gRadius = sys.glowRadius * 1.15 * (0.65 + 0.35 * glowReveal);
          ctx.globalAlpha = sys.opacity * glowReveal * 0.85;
          ctx.drawImage(blackHoleHaloSprite, sys.currentX - gRadius, sys.currentY - gRadius, gRadius * 2, gRadius * 2);
          ctx.globalAlpha = 1.0;

          if (lightReveal > 0.01) {
            const ehR = sys.starRadius * 1.65 * lightReveal;
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(sys.currentX, sys.currentY, ehR, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 236, 205, ' + (sys.opacity * lightReveal * 0.85).toFixed(3) + ')';
            ctx.lineWidth = 1.0;
            ctx.stroke();
          }
        } else {
          const glowSprite = stellarGlowSprites[sys.stellarTypeIndex];
          if (glowSprite && glowReveal > 0.01) {
            const gRadius = sys.glowRadius * pulse * (0.65 + 0.35 * glowReveal);
            ctx.globalAlpha = sys.opacity * glowReveal * 0.72;
            ctx.drawImage(
              glowSprite,
              sys.currentX - gRadius,
              sys.currentY - gRadius,
              gRadius * 2,
              gRadius * 2
            );
            ctx.globalAlpha = 1.0;
          }

          if (lightReveal > 0.01) {
            const coreR = sys.starRadius * (0.55 + 0.45 * lightReveal);
            ctx.save();
            ctx.globalAlpha = sys.opacity * lightReveal * 0.9;
            ctx.fillStyle = sys.stellarType.core;
            ctx.beginPath();
            ctx.arc(sys.currentX, sys.currentY, coreR, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        for (let p = 0; p < sys.planets.length; p++) {
          const planet = sys.planets[p];
          if (planet.depthZ >= 0) {
            const pStagger = isSpawning
              ? smoothstep(0.48 + p * 0.07, 0.78 + p * 0.07, sys.spawnProgress)
              : 1.0;
            drawPlanet(sys, planet, sys.opacity * pStagger);
          }
        }
      }

      function drawMeteors() {
        for (let i = 0; i < meteors.length; i++) {
          const m = meteors[i];
          if (!m.active || m.alpha <= 0.01) continue;

          const speed = Math.hypot(m.vx, m.vy) || 1;
          const dirX = m.vx / speed;
          const dirY = m.vy / speed;
          const tailX = m.x - dirX * m.length;
          const tailY = m.y - dirY * m.length;

          const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
          grad.addColorStop(0.0, 'rgba(235, 244, 255, ' + m.alpha.toFixed(3) + ')');
          grad.addColorStop(0.4, 'rgba(170, 198, 240, ' + (m.alpha * 0.45).toFixed(3) + ')');
          grad.addColorStop(1.0, 'rgba(170, 198, 240, 0)');

          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.25;
          ctx.beginPath();
          ctx.moveTo(m.x, m.y);
          ctx.lineTo(tailX, tailY);
          ctx.stroke();
        }
      }

      // =========================================================================
      // 12. RESIZE, LIFECYCLE & MAIN LOOP
      // =========================================================================
      function resize() {
        const newW = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1920);
        const newH = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1080);
        const newDpr = clamp(window.devicePixelRatio || 1, 1, 1.5);

        const prevW = viewWidth;
        const prevH = viewHeight;

        viewWidth = newW;
        viewHeight = newH;
        W = newW;
        H = newH;
        dpr = newDpr;

        canvas.width = Math.round(viewWidth * dpr);
        canvas.height = Math.round(viewHeight * dpr);
        cv._scale = dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        bgNeedsRedraw = true;
        buildStarField();

        if (isPreviewMode && !hasReceivedHostIcons) {
          const dummyIcons = buildPreviewDummyIcons();
          handleIcons(dummyIcons, { coordSpace: 'css', preview: true });
        } else if (prevW > 0 && prevH > 0 && (prevW !== newW || prevH !== newH)) {
          const sx = newW / prevW;
          const sy = newH / prevH;
          for (let i = 0; i < systems.length; i++) {
            systems[i].anchorX *= sx;
            systems[i].anchorY *= sy;
            systems[i].targetX *= sx;
            systems[i].targetY *= sy;
            const newOrb = computeGlobalOrbitParams(systems[i].anchorX, systems[i].anchorY, systems[i].seed);
            systems[i].globalRadius = newOrb.globalRadius;
          }
        }
      }

      function draw(now) {
        const drawScale = cv._scale || dpr;
        ctx.setTransform(drawScale, 0, 0, drawScale, 0, 0);
        drawBackground();
        drawStars();
        drawGlobalIconOrbits();
        drawCentralCore();
        drawAsteroids();
        drawBlackHoleTidalStreams();
        drawResonanceBridges();

        for (let i = 0; i < systems.length; i++) {
          drawSystem(systems[i]);
        }

        drawMeteors();
        drawPointerEffects();
      }

      function tick(now) {
        requestAnimationFrame(tick);

        isPaused = paused;
        if (isPaused || document.hidden) {
          lastFrameTime = now;
          return;
        }

        const profile = QUALITY_PROFILES[settings.quality] || QUALITY_PROFILES.High;
        const minFrameInterval = 1000 / (profile.targetFps + 2);
        const rawDeltaMs = now - lastFrameTime;
        if (rawDeltaMs < minFrameInterval) return;

        const dt = clamp(rawDeltaMs * 0.001, 0.001, 0.05);
        lastFrameTime = now;
        elapsedTime += dt;

        // Update phase
        updateSystems(dt);
        updatePlanets(dt);
        updateParticles(dt);
        cleanupRemovedSystems();

        draw(now);
        frameN++;
      }

      function spawnCursorSpark(x, y, vx, vy, rgb, size, maxLife) {
        if (cursorSparks.length >= 96) cursorSparks.shift();
        cursorSparks.push({
          x: x,
          y: y,
          vx: vx,
          vy: vy,
          life: 0,
          maxLife: maxLife || 0.75,
          size: size || 2.1,
          rgb: rgb || '255, 210, 145'
        });
      }

      function spawnShockwave(x, y, maxR, rgb, baseAlpha) {
        if (shockwaves.length >= 10) shockwaves.shift();
        shockwaves.push({
          x: x,
          y: y,
          startR: 8,
          r: 8,
          maxR: maxR || 180,
          life: 0,
          maxLife: 0.78,
          alpha: baseAlpha || 0.65,
          baseAlpha: baseAlpha || 0.65,
          rgb: rgb || '255, 200, 125'
        });
      }

      function triggerPointerPulse(x, y) {
        const cx = viewWidth * 0.5;
        const cy = viewHeight * 0.5;
        const distCore = Math.hypot(x - cx, y - cy);

        let hitSys = null;
        let minSysD = 90;
        for (let i = 0; i < systems.length; i++) {
          const d = Math.hypot(systems[i].currentX - x, systems[i].currentY - y);
          if (d < minSysD) {
            minSysD = d;
            hitSys = systems[i];
          }
        }

        if (distCore < 95 && settings.centerBodyType !== 'None') {
          coreFlare = 1.0;
          spawnShockwave(cx, cy, Math.min(viewWidth, viewHeight) * 0.36, '255, 195, 115', 0.8);
          for (let i = 0; i < 18; i++) {
            const ang = (i / 18) * Math.PI * 2 + Math.random() * 0.25;
            const spd = 95 + Math.random() * 145;
            spawnCursorSpark(cx + Math.cos(ang) * 18, cy + Math.sin(ang) * 18, Math.cos(ang) * spd, Math.sin(ang) * spd, '255, 215, 145', 2.4, 0.95);
          }
        } else if (hitSys) {
          hitSys.boost = 1.0;
          spawnShockwave(hitSys.currentX, hitSys.currentY, 150, hitSys.stellarType.orbitRgb || '150, 210, 255', 0.75);
          for (let i = 0; i < 14; i++) {
            const ang = (i / 14) * Math.PI * 2 + Math.random() * 0.3;
            const spd = 65 + Math.random() * 110;
            spawnCursorSpark(hitSys.currentX, hitSys.currentY, Math.cos(ang) * spd, Math.sin(ang) * spd, hitSys.stellarType.coronaRgb || '180, 220, 255', 2.2, 0.85);
          }
        } else {
          spawnShockwave(x, y, 165, '160, 205, 255', 0.6);
          for (let i = 0; i < 12; i++) {
            const ang = (i / 12) * Math.PI * 2 + Math.random() * 0.35;
            const spd = 55 + Math.random() * 95;
            spawnCursorSpark(x, y, Math.cos(ang) * spd, Math.sin(ang) * spd, '190, 220, 255', 2.0, 0.75);
          }
          for (let i = 0; i < meteors.length; i++) {
            if (!meteors[i].active) {
              const ang = Math.atan2(cy - y, cx - x) + (Math.random() - 0.5) * 0.5;
              const spd = 460 + Math.random() * 180;
              meteors[i].active = true;
              meteors[i].x = x;
              meteors[i].y = y;
              meteors[i].vx = Math.cos(ang) * spd;
              meteors[i].vy = Math.sin(ang) * spd;
              meteors[i].length = 64;
              meteors[i].life = 0;
              meteors[i].maxLife = 0.65;
              meteors[i].alpha = 0.75;
              break;
            }
          }
        }
      }

      function drawPointerEffects() {
        for (let i = 0; i < shockwaves.length; i++) {
          const sw = shockwaves[i];
          if (sw.alpha <= 0.01) continue;
          ctx.save();
          ctx.strokeStyle = 'rgba(' + sw.rgb + ', ' + sw.alpha.toFixed(3) + ')';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        for (let i = 0; i < cursorSparks.length; i++) {
          const sp = cursorSparks[i];
          const a = clamp(1 - sp.life / sp.maxLife, 0, 1);
          ctx.fillStyle = 'rgba(' + sp.rgb + ', ' + (a * 0.85).toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, sp.size * (0.4 + 0.6 * a), 0, Math.PI * 2);
          ctx.fill();
        }

        if (pointer.active) {
          const rad = pointer.down ? 44 : 28;
          const grad = ctx.createRadialGradient(pointer.x, pointer.y, 0, pointer.x, pointer.y, rad);
          grad.addColorStop(0, pointer.down ? 'rgba(255, 220, 155, 0.24)' : 'rgba(170, 215, 255, 0.14)');
          grad.addColorStop(0.55, pointer.down ? 'rgba(255, 185, 110, 0.09)' : 'rgba(130, 185, 255, 0.05)');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(pointer.x, pointer.y, rad, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = pointer.down ? 'rgba(255, 210, 140, 0.38)' : 'rgba(170, 215, 255, 0.22)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(pointer.x, pointer.y, pointer.down ? 16 : 11, 0, Math.PI * 2);
          ctx.stroke();
        }

        for (let i = 0; i < systems.length; i++) {
          const sys = systems[i];
          const hg = Math.max(sys.hoverGlow || 0, sys.boost || 0);
          if (hg > 0.04) {
            ctx.strokeStyle = 'rgba(' + sys.stellarType.orbitRgb + ', ' + (hg * 0.35).toFixed(3) + ')';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.arc(sys.currentX, sys.currentY, 26 + hg * 14, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
      }

      function parseUrlParams() {
        try {
          const params = new URLSearchParams(window.location.search || '');
          if (params.has('preview') || params.get('mode') === 'preview') {
            isPreviewMode = true;
          }
          const urlSettings = {};
          params.forEach(function (val, key) {
            urlSettings[key] = val;
          });
          applySettingsPatch(urlSettings);
        } catch (e) {
          // Ignore malformed query string
        }
      }

      function init() {
        buildSprites();
        buildCentralBlackHole();
        buildMeteorsPool();
        parseUrlParams();
        resize();
        buildAsteroids();

        window.addEventListener('message', handleMessage, false);

        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.addEventListener('message', handleMessage);
          if (!isPreviewMode && typeof window.chrome.webview.postMessage === 'function') {
            window.chrome.webview.postMessage('ready');
          }
        }
        if (isPreviewMode && window.parent && window.parent !== window) {
          window.parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
        }

        window.addEventListener('pointermove', function (ev) {
          const rect = canvas.getBoundingClientRect();
          const nx = ev.clientX - rect.left;
          const ny = ev.clientY - rect.top;
          const vx = nx - pointer.x;
          const vy = ny - pointer.y;
          pointer.prevX = pointer.x;
          pointer.prevY = pointer.y;
          pointer.x = nx;
          pointer.y = ny;
          pointer.active = true;
          const now = performance.now();
          if ((pointer.down || Math.hypot(vx, vy) > 4) && now - pointer.lastSparkTime > 28) {
            pointer.lastSparkTime = now;
            spawnCursorSpark(
              nx,
              ny,
              vx * 4 + (Math.random() - 0.5) * 35,
              vy * 4 + (Math.random() - 0.5) * 35,
              pointer.down ? '255, 205, 130' : '175, 220, 255',
              pointer.down ? 2.3 : 1.6,
              pointer.down ? 0.85 : 0.55
            );
          }
        }, { passive: true });

        window.addEventListener('pointerdown', function (ev) {
          const rect = canvas.getBoundingClientRect();
          pointer.x = ev.clientX - rect.left;
          pointer.y = ev.clientY - rect.top;
          pointer.active = true;
          pointer.down = true;
          triggerPointerPulse(pointer.x, pointer.y);
        }, { passive: true });

        window.addEventListener('pointerup', function () {
          pointer.down = false;
        }, { passive: true });

        window.addEventListener('pointercancel', function () {
          pointer.down = false;
        }, { passive: true });

        window.addEventListener('pointerleave', function () {
          pointer.down = false;
          pointer.active = false;
        }, { passive: true });

        window.onDiyarDeskMessage = handleMessage;
        window.applySettings = applySettingsPatch;
        window.updateSettings = applySettingsPatch;
        window.livelyPropertyListener = function (name, val) {
          const patch = {};
          patch[name] = val;
          applySettingsPatch(patch);
        };

        if (window.WallIcons && typeof window.WallIcons.subscribe === 'function') {
          window.WallIcons.subscribe(function (icons, meta) {
            handleMessage({ t: 'icons', icons: icons, dpr: meta && meta.dpr });
          });
        }

        window.addEventListener('resize', resize, { passive: true });
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) {
            lastFrameTime = performance.now();
          }
        });

        if (isPreviewMode) {
          activatePreviewDummyAnchors();
        } else {
          previewFallbackTimer = setTimeout(function () {
            if (!hasReceivedHostIcons) {
              activatePreviewDummyAnchors();
            }
          }, 180);
        }

        lastFrameTime = performance.now();
        requestAnimationFrame(tick);
      }



      Object.defineProperties(window, {
        cv: { get: function () { return cv; } },
        draw: { get: function () { return draw; } },
        icons: { get: function () { return icons; } },
        W: { get: function () { return W; } },
        H: { get: function () { return H; } },
        WALL: { get: function () { return WALL; } },
        frameN: { get: function () { return frameN; } },
        paused: {
          get: function () { return paused; },
          set: function (v) { paused = !!v; isPaused = paused; }
        }
      });

      init();
    })();
  </script>
  <script src="share.js"></script>
