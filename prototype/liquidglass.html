<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Refractive Surface</title>
  <script src="low-mode.js"></script>
  <script src="wall-icons.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c2748; }
    #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: auto; }
    #ghosts { position: fixed; inset: 0; pointer-events: none; }
    .ghost { position: absolute; display: flex; flex-direction: column; align-items: center; padding-top: 6px; opacity: .28; }
    .ghost i { width: 40px; height: 40px; border-radius: 11px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
    .ghost b { width: 46px; height: 6px; margin-top: 8px; border-radius: 3px; background: #fff; }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <script>
  (function () {
    'use strict';

    // =========================================================================
    // 1. CONFIGURATION, PALETTES & QUALITY PROFILES
    // =========================================================================
    const QS = new URLSearchParams(location.search || '');
    const WALL = QS.has('wallpaper');
    const PREVIEW = QS.has('preview');

    const DEFAULTS = {
      palette: 'tahoe',
      refraction: 1.0,
      frostAmount: 0.65,
      dispersion: 0.95,
      dropletCount: 1.0,
      flowSpeed: 0.85,
      cursorLens: true,
      iconGlassStyle: 'capsule',
      quality: 'High',
      adaptive: 1,
      seed: 0
    };
    const P = Object.assign({}, DEFAULTS);

    const PALETTES = {
      tahoe: {
        base: '#0b2545',
        lobes: ['#38bdf8', '#2dd4bf', '#3b82f6', '#bae6fd'],
        caustic: 'rgba(186, 230, 253, 0.24)',
        dispA: '110, 235, 255',
        dispB: '255, 148, 225',
        isDark: false
      },
      aurora: {
        base: '#120f2e',
        lobes: ['#8b5cf6', '#22d3ee', '#ec4899', '#a5b4fc'],
        caustic: 'rgba(196, 181, 253, 0.24)',
        dispA: '103, 232, 249',
        dispB: '244, 114, 182',
        isDark: true
      },
      prism: {
        base: '#24132a',
        lobes: ['#fb7185', '#fbbf24', '#38bdf8', '#fde68a'],
        caustic: 'rgba(254, 240, 138, 0.24)',
        dispA: '125, 211, 252',
        dispB: '251, 146, 60',
        isDark: false
      },
      obsidian: {
        base: '#080b12',
        lobes: ['#1e3a5f', '#312e81', '#0f766e', '#64748b'],
        caustic: 'rgba(148, 163, 184, 0.20)',
        dispA: '125, 211, 252',
        dispB: '192, 132, 252',
        isDark: true
      }
    };

    const QUALITY_PROFILES = {
      Low:    { maxDpr: 0.75, meshScale: 0.30, frostScale: 0.10, dropScale: 0.50, enableBeads: false, shadowSteps: 2 },
      Medium: { maxDpr: 1.25, meshScale: 0.45, frostScale: 0.13, dropScale: 0.85, enableBeads: true,  shadowSteps: 3 },
      High:   { maxDpr: 1.50, meshScale: 0.55, frostScale: 0.15, dropScale: 1.00, enableBeads: true,  shadowSteps: 4 }
    };

    function getProfile() {
      if (window.__desklandLowMode) return QUALITY_PROFILES.Low;
      return QUALITY_PROFILES[P.quality] || QUALITY_PROFILES.High;
    }

    function getPalette() {
      return PALETTES[P.palette] || PALETTES.tahoe;
    }

    // =========================================================================
    // 2. CANVAS & OFFSCREEN REFRACTION BUFFERS
    // =========================================================================
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d', { alpha: false });
    const bgMeshCanvas = document.createElement('canvas');
    const meshCtx = bgMeshCanvas.getContext('2d', { alpha: false });
    const frostMidCanvas = document.createElement('canvas');
    const frostMidCtx = frostMidCanvas.getContext('2d', { alpha: false });
    const frostCanvas = document.createElement('canvas');
    const frostCtx = frostCanvas.getContext('2d', { alpha: false });

    let W = innerWidth || 1920;
    let H = innerHeight || 1080;
    let scale = 1;
    let cacheOK = false;
    let paused = false;
    let _rafId = 0;
    let lastT = 0;
    let simTime = 0;
    let seed = 20261118;
    let icons = [];
    let iconsSeen = false;

    const pointer = { x: -9999, y: -9999, active: false, down: false, lensOpacity: 0 };

    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function mulberry32(a) {
      let s = a >>> 0;
      return function () {
        s = (s + 0x6D2B79F5) >>> 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function roundRect(c, x, y, w, h, r) {
      const rr = Math.min(r, w * 0.5, h * 0.5);
      c.beginPath();
      c.moveTo(x + rr, y);
      c.arcTo(x + w, y, x + w, y + h, rr);
      c.arcTo(x + w, y + h, x, y + h, rr);
      c.arcTo(x, y + h, x, y, rr);
      c.arcTo(x, y, x + w, y, rr);
      c.closePath();
    }

    // =========================================================================
    // 3. FLOATING LIQUID DROPLETS, RIPPLES & SPECULAR BEADS
    // =========================================================================
    const droplets = [];
    const ripples = [];
    const beads = [];

    function buildDroplets() {
      const prof = getProfile();
      const count = clamp(Math.round(9 * P.dropletCount * prof.dropScale), 0, 18);
      const rng = mulberry32(seed ^ 0x4C474C53);
      droplets.length = 0;

      for (let i = 0; i < count; i++) {
        const isPill = rng() > 0.45;
        const w = isPill ? (108 + Math.round(rng() * 76)) : (56 + Math.round(rng() * 54));
        const h = isPill ? (52 + Math.round(rng() * 34)) : w;
        droplets.push({
          w: w,
          h: h,
          r: Math.round(Math.min(w, h) * 0.5),
          homeX: (0.10 + rng() * 0.80) * W,
          homeY: (0.10 + rng() * 0.80) * H,
          x: (0.10 + rng() * 0.80) * W,
          y: (0.10 + rng() * 0.80) * H,
          vx: 0,
          vy: 0,
          ampX: 14 + rng() * 24,
          ampY: 12 + rng() * 22,
          freqX: 0.30 + rng() * 0.38,
          freqY: 0.36 + rng() * 0.42,
          phase: rng() * Math.PI * 2,
          stretch: 0,
          stretchVel: 0,
          angle: 0
        });
      }
    }

    function spawnLiquidRipple(x, y) {
      if (ripples.length >= 5) ripples.shift();
      ripples.push({ x: x, y: y, r: 10, maxR: Math.hypot(W, H) * 0.45, speed: 360 });

      const prof = getProfile();
      if (!prof.enableBeads) return;
      for (let i = 0; i < 8; i++) {
        if (beads.length >= 36) beads.shift();
        const ang = (i / 8) * Math.PI * 2 + Math.random() * 0.3;
        const spd = 70 + Math.random() * 110;
        beads.push({
          x: x, y: y,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          r: 4 + Math.random() * 5,
          life: 0, maxLife: 0.75
        });
      }

      for (let i = 0; i < droplets.length; i++) {
        const d = droplets[i];
        const dx = d.x - x, dy = d.y - y;
        const dist = Math.hypot(dx, dy) || 1;
        if (dist < 260) {
          const inf = 1 - dist / 260;
          d.stretchVel += inf * 1.4;
          d.vx += (dx / dist) * inf * 140;
          d.vy += (dy / dist) * inf * 140;
        }
      }
    }

    // =========================================================================
    // 4. ADAPTIVE DESKTOP ICON GLASS CAPSULES
    // =========================================================================
    const iconStates = [];

    function syncIncomingIcons(rects) {
      icons = Array.isArray(rects) ? rects : [];
      iconsSeen = true;

      const matched = new Set();
      for (let i = 0; i < icons.length; i++) {
        const ic = icons[i];
        let bestIdx = -1;
        let bestDist = 48;
        for (let s = 0; s < iconStates.length; s++) {
          if (matched.has(s)) continue;
          const st = iconStates[s];
          const d = Math.hypot(ic.x - st.tx, ic.y - st.ty);
          if (d < bestDist) { bestDist = d; bestIdx = s; }
        }
        if (bestIdx >= 0) {
          const st = iconStates[bestIdx];
          st.tx = ic.x; st.ty = ic.y; st.tw = ic.w; st.th = ic.h;
          st.removing = false;
          matched.add(bestIdx);
        } else {
          iconStates.push({
            x: ic.x, y: ic.y, w: ic.w, h: ic.h,
            tx: ic.x, ty: ic.y, tw: ic.w, th: ic.h,
            opacity: 0,
            hover: 0,
            removing: false
          });
          matched.add(iconStates.length - 1);
        }
      }
      for (let s = 0; s < iconStates.length; s++) {
        if (!matched.has(s)) iconStates[s].removing = true;
      }
    }

    // =========================================================================
    // 5. SIMULATION STEP
    // =========================================================================
    function stepSimulation(dt) {
      const fSpd = clamp(P.flowSpeed, 0, 2.5);
      simTime += dt * (0.2 + fSpd * 0.85);

      const lensTarget = (P.cursorLens && pointer.active) ? 1 : 0;
      pointer.lensOpacity = lerp(pointer.lensOpacity, lensTarget, 1 - Math.exp(-10 * dt));

      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.r += rp.speed * dt;
        if (rp.r >= rp.maxR) ripples.splice(i, 1);
      }

      for (let i = beads.length - 1; i >= 0; i--) {
        const b = beads[i];
        b.life += dt;
        if (b.life >= b.maxLife) { beads.splice(i, 1); continue; }
        b.vx *= Math.exp(-3.2 * dt);
        b.vy *= Math.exp(-3.2 * dt);
        b.x += b.vx * dt;
        b.y += b.vy * dt;
      }

      for (let i = 0; i < droplets.length; i++) {
        const d = droplets[i];
        const hx = d.homeX + Math.sin(simTime * d.freqX + d.phase) * d.ampX;
        const hy = d.homeY + Math.cos(simTime * d.freqY + d.phase * 1.2) * d.ampY;
        let px = 0, py = 0;
        if (pointer.active) {
          const dx = d.x - pointer.x, dy = d.y - pointer.y;
          const dist = Math.hypot(dx, dy) || 1;
          const hitR = Math.max(d.w, d.h) * 0.55 + 72;
          if (dist < hitR) {
            const inf = 1 - dist / hitR;
            px = (dx / dist) * inf * 240;
            py = (dy / dist) * inf * 240;
          }
        }
        if (P.adaptive !== 0) {
          for (let j = 0; j < icons.length; j++) {
            const ic = icons[j];
            const dx = d.x - (ic.x + ic.w * 0.5);
            const dy = d.y - (ic.y + ic.h * 0.5);
            const minSep = Math.max(ic.w, ic.h) * 0.6 + Math.max(d.w, d.h) * 0.45 + 14;
            const dist = Math.hypot(dx, dy) || 1;
            if (dist < minSep) {
              const inf = 1 - dist / minSep;
              px += (dx / dist) * inf * 220;
              py += (dy / dist) * inf * 220;
            }
          }
        }
        d.vx += ((hx - d.x) * 10 + px - d.vx * 4.2) * dt;
        d.vy += ((hy - d.y) * 10 + py - d.vy * 4.2) * dt;
        d.x += d.vx * dt;
        d.y += d.vy * dt;

        const speed = Math.hypot(d.vx, d.vy);
        if (speed > 4) {
          d.angle = Math.atan2(d.vy, d.vx);
        }
        const targetStretch = clamp(speed * 0.0012, 0, 0.16);
        const acc = (targetStretch - d.stretch) * 68 - d.stretchVel * 8.5;
        d.stretchVel += acc * dt;
        d.stretch = clamp(d.stretch + d.stretchVel * dt, -0.14, 0.18);
      }

      const posAlpha = 1 - Math.exp(-10 * dt);
      for (let i = iconStates.length - 1; i >= 0; i--) {
        const st = iconStates[i];
        st.x = lerp(st.x, st.tx, posAlpha);
        st.y = lerp(st.y, st.ty, posAlpha);
        st.w = lerp(st.w, st.tw, posAlpha);
        st.h = lerp(st.h, st.th, posAlpha);
        if (st.removing) {
          st.opacity = Math.max(0, st.opacity - dt * 2.5);
          if (st.opacity <= 0.005) { iconStates.splice(i, 1); continue; }
        } else {
          st.opacity = Math.min(1, st.opacity + dt * 3.0);
        }
        let ht = 0;
        if (pointer.active) {
          const dist = Math.hypot(st.x + st.w * 0.5 - pointer.x, st.y + st.h * 0.5 - pointer.y);
          if (dist < 78) ht = (1 - dist / 78) * (pointer.down ? 1.0 : 0.65);
        }
        st.hover = lerp(st.hover, ht, 1 - Math.exp(-10 * dt));
      }
    }

    // =========================================================================
    // 6. OPTICAL LIQUID GLASS RENDERING PIPELINE
    // =========================================================================
    function renderSilkBackdrop(pal) {
      const mw = bgMeshCanvas.width;
      const mh = bgMeshCanvas.height;
      meshCtx.fillStyle = pal.base;
      meshCtx.fillRect(0, 0, mw, mh);

      const maxDim = Math.max(mw, mh);
      for (let i = 0; i < pal.lobes.length; i++) {
        const cx = mw * (0.18 + 0.22 * i + Math.sin(simTime * (0.42 + i * 0.11) + i * 1.3) * 0.18);
        const cy = mh * (0.50 + Math.cos(simTime * (0.36 + i * 0.13) + i * 1.7) * 0.34);
        const rad = maxDim * (0.48 + 0.08 * i);
        const g = meshCtx.createRadialGradient(cx, cy, 0, cx, cy, rad);
        g.addColorStop(0.0, pal.lobes[i]);
        g.addColorStop(1.0, 'rgba(0,0,0,0)');
        meshCtx.globalAlpha = 0.78;
        meshCtx.fillStyle = g;
        meshCtx.fillRect(0, 0, mw, mh);
      }
      meshCtx.globalAlpha = 1.0;

      // Two-step bilinear downscale for buttery smooth frost blur (zero ctx.filter!)
      frostMidCtx.drawImage(bgMeshCanvas, 0, 0, frostMidCanvas.width, frostMidCanvas.height);
      frostCtx.drawImage(frostMidCanvas, 0, 0, frostCanvas.width, frostCanvas.height);
      cacheOK = true;
    }

    function drawLiquidGlassCapsule(cx, cy, w, h, r, pal, prof, frostMix, zoomFactor, sxScale, syScale, rotAngle, isPrismOnly, labelContrast) {
      const halfW = w * 0.5;
      const halfH = h * 0.5;
      const refract = clamp(P.refraction, 0.1, 1.8);
      const disp = clamp(P.dispersion, 0.0, 1.8);

      ctx.save();
      ctx.translate(cx, cy);
      if (rotAngle) ctx.rotate(rotAngle);
      if (sxScale !== 1 || syScale !== 1) ctx.scale(sxScale, syScale);

      // Soft multi-pass shadow (zero shadowBlur!)
      if (!isPrismOnly) {
        for (let s = prof.shadowSteps; s >= 1; s--) {
          const sp = s * 4.5;
          ctx.fillStyle = 'rgba(0, 0, 0, ' + (0.045 * (prof.shadowSteps + 1 - s) / prof.shadowSteps).toFixed(3) + ')';
          roundRect(ctx, -halfW - sp * 0.4, -halfH + 7 - sp * 0.25, w + sp * 0.8, h + sp * 0.8, r + sp * 0.35);
          ctx.fill();
        }
      }

      // Clipped optical refraction & frost interior
      ctx.save();
      roundRect(ctx, -halfW, -halfH, w, h, r);
      ctx.clip();

      if (!isPrismOnly) {
        const zoom = 1 + (zoomFactor || 0.18) * refract;
        const ox = (W * 0.5 - cx) * 0.11 * refract;
        const oy = (H * 0.5 - cy) * 0.11 * refract;
        // Undo local translate/rotate for world-aligned background sampling
        if (sxScale !== 1 || syScale !== 1) ctx.scale(1 / sxScale, 1 / syScale);
        if (rotAngle) ctx.rotate(-rotAngle);
        ctx.translate(-cx, -cy);

        const drawW = W * zoom;
        const drawH = H * zoom;
        const drawX = -W * (zoom - 1) * 0.5 + ox;
        const drawY = -H * (zoom - 1) * 0.5 + oy;

        if (frostMix > 0.02) {
          ctx.globalAlpha = clamp(frostMix, 0, 1);
          ctx.drawImage(frostCanvas, drawX, drawY, drawW, drawH);
        }
        const sharpMix = clamp(1 - frostMix * 0.72, 0.18, 0.95);
        ctx.globalAlpha = sharpMix;
        ctx.drawImage(bgMeshCanvas, drawX + ox * 0.35, drawY + oy * 0.35, drawW, drawH);
        ctx.globalAlpha = 1.0;

        // Re-apply local transform for specular sheen & rims
        ctx.translate(cx, cy);
        if (rotAngle) ctx.rotate(rotAngle);
        if (sxScale !== 1 || syScale !== 1) ctx.scale(sxScale, syScale);
      }

      // Glass surface specular sheen & internal caustic reflection
      const sheen = ctx.createLinearGradient(-halfW, -halfH, halfW * 0.65, halfH);
      sheen.addColorStop(0.0, 'rgba(255, 255, 255, ' + (isPrismOnly ? '0.18' : '0.32') + ')');
      sheen.addColorStop(0.42, 'rgba(255, 255, 255, 0.04)');
      sheen.addColorStop(1.0, pal.caustic);
      ctx.fillStyle = sheen;
      ctx.fillRect(-halfW, -halfH, w, h);

      // Subtle neutral tint behind desktop icon text for contrast safety
      if (labelContrast) {
        ctx.fillStyle = 'rgba(10, 14, 24, 0.24)';
        roundRect(ctx, -halfW + 6, halfH - 22, w - 12, 16, 8);
        ctx.fill();
      }

      // Prismatic chromatic edge dispersion (cyan + magenta inner rim offsets)
      if (disp > 0.02) {
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = 'rgba(' + pal.dispA + ', ' + clamp(0.36 * disp, 0, 0.65).toFixed(3) + ')';
        roundRect(ctx, -halfW + 1.5, -halfH + 1.5, w, h, r);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(' + pal.dispB + ', ' + clamp(0.28 * disp, 0, 0.55).toFixed(3) + ')';
        roundRect(ctx, -halfW - 1.5, -halfH - 1.5, w, h, r);
        ctx.stroke();
      }

      ctx.restore();

      // Crisp outer liquid glass specular rim
      ctx.lineWidth = isPrismOnly ? 1.8 : 1.35;
      ctx.strokeStyle = 'rgba(255, 255, 255, ' + (isPrismOnly ? '0.68' : '0.58') + ')';
      roundRect(ctx, -halfW, -halfH, w, h, r);
      ctx.stroke();

      ctx.restore();
    }

    function draw() {
      const pal = getPalette();
      const prof = getProfile();

      document.documentElement.style.background = pal.base;
      document.body.style.background = pal.base;

      renderSilkBackdrop(pal);

      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.drawImage(bgMeshCanvas, 0, 0, W, H);

      const frostMix = clamp(P.frostAmount, 0, 1.5);

      // 1. Floating optical Liquid Glass droplets
      for (let i = 0; i < droplets.length; i++) {
        const d = droplets[i];
        const sx = 1 + d.stretch;
        const sy = 1 / Math.max(0.82, 1 + d.stretch);
        drawLiquidGlassCapsule(d.x, d.y, d.w, d.h, d.r, pal, prof, frostMix * 0.55, 0.20, sx, sy, d.angle, false, false);
      }

      // 2. Adaptive desktop icon glass capsules
      if (P.adaptive !== 0) {
        const isDroplet = P.iconGlassStyle === 'droplet';
        const isPrism = P.iconGlassStyle === 'prism';
        const iconFrost = isDroplet ? frostMix * 0.25 : clamp(frostMix, 0.2, 1.0);

        for (let i = 0; i < iconStates.length; i++) {
          const st = iconStates[i];
          if (st.opacity <= 0.01) continue;
          const cw = Math.round(st.w + 20);
          const ch = Math.round(st.h + 14);
          const cr = isDroplet ? Math.round(Math.min(cw, ch) * 0.45) : 18;
          const sc = 1 + st.hover * 0.04;

          ctx.save();
          ctx.globalAlpha = st.opacity;
          drawLiquidGlassCapsule(
            st.x + st.w * 0.5,
            st.y + st.h * 0.5,
            cw, ch, cr,
            pal, prof,
            iconFrost,
            0.16 + st.hover * 0.08,
            sc, sc, 0,
            isPrism,
            !pal.isDark
          );
          ctx.restore();
        }
      }

      // 3. Interactive cursor optical glass lens
      if (pointer.lensOpacity > 0.02) {
        ctx.save();
        ctx.globalAlpha = pointer.lensOpacity;
        const lr = pointer.down ? 76 : 64;
        drawLiquidGlassCapsule(pointer.x, pointer.y, lr, lr, lr * 0.5, pal, prof, frostMix * 0.18, 0.28, 1, 1, 0, false, false);
        ctx.restore();
      }

      // 4. Refractive click ripples & specular beads
      for (let i = 0; i < ripples.length; i++) {
        const rp = ripples[i];
        const fade = 1 - rp.r / rp.maxR;
        if (fade <= 0.01) continue;
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = 'rgba(255, 255, 255, ' + (fade * 0.48).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.lineWidth = 1.2;
        ctx.strokeStyle = 'rgba(' + pal.dispA + ', ' + (fade * 0.32).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r + 3, 0, Math.PI * 2);
        ctx.stroke();
      }

      for (let i = 0; i < beads.length; i++) {
        const b = beads[i];
        const fade = clamp(1 - b.life / b.maxLife, 0, 1);
        ctx.fillStyle = 'rgba(255, 255, 255, ' + (fade * 0.65).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * fade, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // =========================================================================
    // 7. RESIZE, LIFECYCLE & HOST PROTOCOL
    // =========================================================================
    function resize() {
      const box = cv.getBoundingClientRect();
      W = box.width || innerWidth || 1920;
      H = box.height || innerHeight || 1080;
      const prof = getProfile();
      scale = window.__desklandScale
        ? window.__desklandScale(prof.maxDpr, 0.45)
        : (PREVIEW ? 0.45 : Math.min(devicePixelRatio || 1, prof.maxDpr));
      cv.width = Math.max(1, Math.round(W * scale));
      cv.height = Math.max(1, Math.round(H * scale));
      cv._scale = scale;

      bgMeshCanvas.width = Math.max(64, Math.round(W * prof.meshScale));
      bgMeshCanvas.height = Math.max(36, Math.round(H * prof.meshScale));
      frostMidCanvas.width = Math.max(48, Math.round(W * prof.frostScale * 2));
      frostMidCanvas.height = Math.max(27, Math.round(H * prof.frostScale * 2));
      frostCanvas.width = Math.max(24, Math.round(W * prof.frostScale));
      frostCanvas.height = Math.max(14, Math.round(H * prof.frostScale));

      buildDroplets();
    }

    function _scheduleFrame() {
      if (!paused && !_rafId) _rafId = requestAnimationFrame(frame);
    }

    function _setPaused(v) {
      paused = PREVIEW ? false : !!v;
      if (paused) {
        if (_rafId) { cancelAnimationFrame(_rafId); _rafId = 0; }
        lastT = 0;
      } else {
        _scheduleFrame();
      }
    }

    function frame(now) {
      _rafId = 0;
      if (paused || document.hidden) { lastT = 0; return; }
      _scheduleFrame();
      const maxDt = window.__desklandLowMode ? 0.12 : 0.08;
      const dt = lastT ? Math.min((now - lastT) / 1000, maxDt) : 0.03;
      lastT = now;

      stepSimulation(dt);
      draw();
    }

    function applySettings(v) {
      if (!v || typeof v !== 'object') return;
      let needDroplets = false;

      if (typeof v.seed === 'number' && v.seed !== seed) {
        seed = (v.seed >>> 0) || 20261118;
        needDroplets = true;
      }
      if (typeof v.palette === 'string' && v.palette in PALETTES) {
        P.palette = v.palette;
      }
      if (typeof v.iconGlassStyle === 'string' && (v.iconGlassStyle === 'capsule' || v.iconGlassStyle === 'droplet' || v.iconGlassStyle === 'prism')) {
        P.iconGlassStyle = v.iconGlassStyle;
      }
      if (typeof v.quality === 'string' && v.quality in QUALITY_PROFILES && v.quality !== P.quality) {
        P.quality = v.quality;
        resize();
      }
      if (v.cursorLens !== undefined) {
        P.cursorLens = (v.cursorLens === true || v.cursorLens === 'true' || v.cursorLens === 1);
      }

      const numKeys = ['refraction', 'frostAmount', 'dispersion', 'dropletCount', 'flowSpeed', 'adaptive'];
      for (let i = 0; i < numKeys.length; i++) {
        const k = numKeys[i];
        if (v[k] !== undefined) {
          const n = Number(v[k]);
          if (Number.isFinite(n) && P[k] !== n) {
            P[k] = n;
            if (k === 'dropletCount') needDroplets = true;
          }
        }
      }

      if (needDroplets) buildDroplets();
    }

    function drawGhosts() {
      const box = document.getElementById('ghosts');
      if (!box) return;
      box.innerHTML = icons.map(ic =>
        `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`
      ).join('');
    }

    function handleMessage(ev) {
      let m = ev && ev.data !== undefined ? ev.data : ev;
      if (typeof m === 'string') {
        try { m = JSON.parse(m); } catch (e) { return; }
      }
      if (!m || typeof m !== 'object') return;
      const kind = m.t || m.type;
      if (kind === 'pause') {
        _setPaused(m.v);
        if (paused) draw();
        return;
      }
      if (kind === 'resume') {
        _setPaused(false);
        return;
      }
      if (kind === 'settings') { applySettings(m.v || m.params || m); return; }
      if (kind === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
      if (kind === 'icons') {
        const k = window.devicePixelRatio || 1;
        const rects = m.vis !== false && Array.isArray(m.r)
          ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k }))
          : [];
        syncIncomingIcons(rects);
        if (PREVIEW) drawGhosts();
        if (paused) draw();
      }
    }

    function buildDemoIcons() {
      const cells = [
        [0.05, 0.14], [0.05, 0.30], [0.05, 0.46], [0.05, 0.62],
        [0.14, 0.14], [0.14, 0.30], [0.44, 0.68], [0.54, 0.68], [0.80, 0.72]
      ];
      return cells.map(([fx, fy], i) => ({
        x: Math.round(fx * W),
        y: Math.round(fy * H),
        w: i % 3 === 0 ? 80 : 72,
        h: 86
      }));
    }

    function init() {
      resize();
      window.addEventListener('resize', resize, { passive: true });
      window.addEventListener('deskland:lowmode', resize);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && !paused) lastT = 0;
      });

      window.addEventListener('pointermove', function (ev) {
        const rect = cv.getBoundingClientRect();
        pointer.x = ev.clientX - rect.left;
        pointer.y = ev.clientY - rect.top;
        pointer.active = true;
      }, { passive: true });

      window.addEventListener('pointerdown', function (ev) {
        const rect = cv.getBoundingClientRect();
        pointer.x = ev.clientX - rect.left;
        pointer.y = ev.clientY - rect.top;
        pointer.active = true;
        pointer.down = true;
        spawnLiquidRipple(pointer.x, pointer.y);
      }, { passive: true });

      window.addEventListener('pointerup', function () { pointer.down = false; }, { passive: true });
      window.addEventListener('pointercancel', function () { pointer.down = false; }, { passive: true });
      window.addEventListener('pointerleave', function () { pointer.down = false; pointer.active = false; }, { passive: true });

      if (PREVIEW) {
        document.body.classList.add('preview');
        const g = document.createElement('div');
        g.id = 'ghosts';
        document.body.appendChild(g);
        window.addEventListener('message', handleMessage, false);
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
        }
      } else if (WALL) {
        window.addEventListener('message', handleMessage, false);
        const host = window.chrome && window.chrome.webview;
        if (host) {
          host.addEventListener('message', handleMessage);
          host.postMessage('ready');
        }
      } else {
        syncIncomingIcons(buildDemoIcons());
      }

      if (window.WallIcons && typeof window.WallIcons.subscribe === 'function') {
        window.WallIcons.subscribe(function (vList) {
          if (!WALL && !PREVIEW) return;
          if (!iconsSeen && Array.isArray(vList) && vList.length) {
            const k = window.devicePixelRatio || 1;
            const rects = vList.map(v => ({ x: v.left / k, y: v.top / k, w: (v.right - v.left) / k, h: (v.bottom - v.top) / k }));
            syncIncomingIcons(rects);
          }
        });
      }

      Object.defineProperty(window, 'cv', { get: () => cv });
      Object.defineProperty(window, 'W', { get: () => W });
      Object.defineProperty(window, 'H', { get: () => H });
      Object.defineProperty(window, 'WALL', { get: () => WALL });
      Object.defineProperty(window, 'icons', { get: () => icons });
      Object.defineProperty(window, 'cacheOK', { get: () => cacheOK, set: v => { cacheOK = !!v; } });
      window.draw = draw;
      window.handleMessage = handleMessage;

      _scheduleFrame();
    }

    init();
  })();
  </script>
  <script src="share.js"></script>
</body>
