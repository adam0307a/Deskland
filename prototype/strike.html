<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskland · 炙热沙城（原型）</title>
<script src="wall-icons.js"></script>
<!--
  Deskland · 炙热沙城主题（俯视；纯 WebGL2，2D）
  画风：烈日炙烤下的沙漠战术广场（Dust/Mirage 灵感），暖黄沙砖与屋檐斜影之间，
  图标周围展开布满真实弹孔裂纹与弹出弹壳的水泥掩体区；可被图标踢开的经典足球与巡游小鸡点缀其间。
  - 图标周围（CPU 距离场）：s < 0 为弹痕水泥战区（伴随黑黄警示边沿），s > 0 为阳光沙城广场
  - 木箱掩体、油桶、沙袋、弹孔贴花、弹壳、小鸡与物理足球：预烘焙进 Canvas2D 图集，WebGL2 实例化绘制
-->
<style>
  :root { --taskbar: 48px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9c7e54; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #desktop { position: fixed; left: 0; top: 0; right: 0; bottom: var(--taskbar); }

  .icon {
    position: absolute; width: 76px; padding: 4px 2px 5px;
    display: flex; flex-direction: column; align-items: center;
    border: 1px solid transparent; border-radius: 4px;
    user-select: none; touch-action: none; cursor: default;
  }
  .icon:hover { background: rgba(242,168,54,.16); border-color: rgba(248,196,92,.36); }
  .icon.sel { background: rgba(212,124,28,.36); border-color: rgba(255,196,86,.8); }
  .icon.drag { opacity: .88; z-index: 10; transform: scale(1.04); }
  .icon.settle { transition: left .22s cubic-bezier(.2,.8,.3,1), top .22s cubic-bezier(.2,.8,.3,1); }
  .icon.born { animation: born .45s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes born { from { opacity: 0; transform: scale(.6); } }
  .glyph { width: 48px; height: 48px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)) drop-shadow(3px 6px 5px rgba(24,16,8,.55)); pointer-events: none; }
  .glyph svg { width: 100%; height: 100%; display: block; }
  .label {
    margin-top: 3px; max-width: 72px; font-size: 12px; line-height: 15px; color: #fbf8f0; text-align: center;
    text-shadow: 0 0 3px rgba(0,0,0,.95), 0 1px 3px rgba(0,0,0,.95);
    word-break: break-all; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    pointer-events: none;
  }

  #taskbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--taskbar);
    background: rgba(26,22,18,.74); backdrop-filter: blur(28px) saturate(1.4); -webkit-backdrop-filter: blur(28px) saturate(1.4);
    border-top: 1px solid rgba(235,168,58,.24);
    display: flex; align-items: center; justify-content: center; z-index: 40;
  }
  #taskbar .apps { display: flex; gap: 4px; }
  #taskbar .app { width: 40px; height: 40px; border-radius: 4px; display: grid; place-items: center; }
  #taskbar .app:hover { background: rgba(255,255,255,.08); }
  #taskbar .app svg { width: 24px; height: 24px; }
  #clock { position: absolute; right: 14px; color: #f4eee4; font-size: 12px; line-height: 16px; text-align: right; }

  #panel {
    position: fixed; top: 14px; right: 14px; width: 284px; max-height: calc(100vh - var(--taskbar) - 28px); overflow: auto;
    background: rgba(24,20,18,.84); backdrop-filter: blur(18px) saturate(1.25); -webkit-backdrop-filter: blur(18px) saturate(1.25);
    color: #f0ebe2; border: 1px solid rgba(232,168,58,.32); border-radius: 12px;
    font-size: 12px; line-height: 1.4; box-shadow: 0 12px 32px rgba(0,0,0,.42); z-index: 50;
  }
  #panel.hidden { display: none; }
  body.wall #panel, body.wall #taskbar, body.wall #desktop { display: none; }
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(252,248,240,.88); box-shadow: 3px 6px 8px rgba(24,18,12,.45); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(252,248,240,.76); }
  #panel header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 10px; }
  #panel header b { font-size: 14px; letter-spacing: .06em; color: #f5b642; }
  #panel header span { margin-left: 8px; opacity: .65; }
  #panel.collapsed .body { display: none; }
  .ibtn { background: none; border: 0; color: inherit; opacity: .65; cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px; }
  .ibtn:hover { opacity: 1; }
  #panel .body { padding: 0 14px 14px; }
  .sec { margin-top: 12px; }
  .sec > .t { opacity: .62; margin-bottom: 6px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(255,255,255,.06); border-radius: 7px; padding: 2px; gap: 2px; }
  .seg button { background: none; border: 0; color: inherit; padding: 5px 0; border-radius: 5px; cursor: pointer; font: inherit; opacity: .75; white-space: nowrap; }
  .seg button:hover { opacity: 1; }
  .seg button.on { background: rgba(242,168,54,.24); opacity: 1; color: #ffe09e; }
  .slider { margin-top: 9px; }
  .slider .row { display: flex; justify-content: space-between; }
  .slider .row span:last-child { opacity: .65; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 4px 0 0; accent-color: #f2a836; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggles input { accent-color: #f2a836; margin: 0; }
  .btns { display: flex; gap: 6px; }
  .btns button {
    flex: 1; font: inherit; color: inherit; cursor: pointer; padding: 7px 0; border-radius: 7px;
    background: rgba(255,255,255,.09); border: 1px solid rgba(232,168,58,.24);
  }
  .btns button:hover { background: rgba(242,168,54,.18); }
  #stats { margin-top: 12px; padding: 8px 10px; border-radius: 7px; background: rgba(0,0,0,.3); font-family: Consolas, "Cascadia Mono", monospace; font-size: 11px; line-height: 1.6; color: #eadfc8; }
  #stats .live { color: #ffbd4a; }
  .hint { margin-top: 10px; opacity: .55; font-size: 11px; line-height: 1.6; }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font-size: 16px; }
</style>
</head>

<aside id="panel">
  <header>
    <div><b>Deskland</b><span>炙热沙城 · 原型</span></div>
    <div><button class="ibtn" id="collapse" title="折叠">–</button></div>

  <div class="body">

      <div class="seg">

      </div>

      <label><input type="checkbox" data-key="debug">显示战区边界</label>
      <label><input type="checkbox" data-key="snap">对齐网格</label>

<script>
'use strict';

/* ======================================================================
   参数（与 themes.json 默认值严格同步）
   ====================================================================== */
const P = {
  sigma: 82, warp: 20, holes: 1.0, smoke: 0.45, wind: 1.0,
  ball: 1, chickens: 4, crates: 1.0,
  adaptive: 1, debug: false, snap: true, quality: 2, cap30: true,
};
const DEFAULTS = Object.assign({}, P);
const DISPLAY_KEYS = ['adaptive'];
const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper'), PREVIEW = QS.has('preview');
if (PREVIEW) { P.quality = 1; P.cap30 = false; }

const SLIDERS = [
  { key: 'sigma',    label: '弹孔区大小', min: 40,  max: 200, step: 1,    act: 'field', fmt: v => v + ' px' },
  { key: 'warp',     label: '边缘碎裂',   min: 0,   max: 80,  step: 1,    act: 'field', fmt: v => String(v) },
  { key: 'holes',    label: '弹孔密度',   min: 0,   max: 2,   step: 0.05, act: 'props', fmt: v => v.toFixed(2) + 'x' },
  { key: 'smoke',    label: '战术烟尘',   min: 0,   max: 1,   step: 0.01, act: 'props', fmt: v => Math.round(v * 100) + '%' },
  { key: 'wind',     label: '沙风流速',   min: 0,   max: 3,   step: 0.05, act: 'draw',  fmt: v => v.toFixed(2) + 'x' },
  { key: 'ball',     label: '场内足球',   min: 0,   max: 3,   step: 1,    act: 'props', fmt: v => v + ' 颗' },
  { key: 'chickens', label: '巡游小鸡',   min: 0,   max: 10,  step: 1,    act: 'props', fmt: v => v + ' 只' },
  { key: 'crates',   label: '木箱掩体',   min: 0.2, max: 1.5, step: 0.05, act: 'rebuild', fmt: v => v.toFixed(2) + 'x' },
];

const TASKBAR = 48, CELL_W = 86, CELL_H = 104, GRID_X0 = 14, GRID_Y0 = 10;
const STEP = 5;
const MORPH_MS = 1200;

/* ======================================================================
   桌面图标 SVG（仅原型演示使用）
   ====================================================================== */
const SVG = {
  folder: '<path d="M4 11c0-2 1-3 3-3h10l3 4h21c2 0 3 1 3 3v22c0 2-1 3-3 3H7c-2 0-3-1-3-3z" fill="#e69a1a"/><path d="M4 15h40v21c0 2-1 3-3 3H7c-2 0-3-1-3-3z" fill="#ffd046"/><path d="M4 15h40v2H4z" fill="#ffe785" opacity=".6"/>',
  bin: '<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f6fa"/><stop offset="1" stop-color="#9aa7b6"/></linearGradient></defs><path d="M14 14h20l-2 27H16z" fill="url(#bg)" stroke="#6c7886" stroke-width="1.3"/><path d="M11 12h26v3H11z" rx="1" fill="#c7d0da" stroke="#6c7886" stroke-width="1.2"/><path d="M19 9h10v3H19z" fill="#9aa7b6"/><path d="M20 19v16M24 19v16M28 19v16" stroke="#7d8a98" stroke-width="1.5" stroke-linecap="round"/>',
  pdf: '<path d="M9 5h22l8 8v30H9z" fill="#fff" stroke="#cbd2da"/><path d="M31 5v8h8" fill="#e5e9ee"/><rect x="11" y="23" width="26" height="14" rx="2" fill="#e23b2c"/><text x="24" y="34" text-anchor="middle" font-family="Segoe UI,Arial" font-weight="700" font-size="10" fill="#fff">PDF</text>',
  docx: '<path d="M9 5h22l8 8v30H9z" fill="#fff" stroke="#cbd2da"/><path d="M31 5v8h8" fill="#e5e9ee"/><rect x="11" y="23" width="26" height="14" rx="2" fill="#2368c4"/><text x="24" y="34" text-anchor="middle" font-family="Segoe UI,Arial" font-weight="700" font-size="10" fill="#fff">W</text>',
  xlsx: '<path d="M9 5h22l8 8v30H9z" fill="#fff" stroke="#cbd2da"/><path d="M31 5v8h8" fill="#e5e9ee"/><rect x="11" y="23" width="26" height="14" rx="2" fill="#1d8549"/><text x="24" y="34" text-anchor="middle" font-family="Segoe UI,Arial" font-weight="700" font-size="10" fill="#fff">X</text>',
  png: '<rect x="6" y="8" width="36" height="32" rx="3" fill="#2b4560" stroke="#dfe6ee" stroke-width="1.5"/><circle cx="16" cy="18" r="3.5" fill="#ffd464"/><path d="M8 36l9-10 7 7 5-5 11 8z" fill="#5cc49a"/>',
  shot: '<rect x="6" y="8" width="36" height="32" rx="3" fill="#e4eaf2" stroke="#b9c3d0" stroke-width="1.3"/><rect x="11" y="13" width="26" height="22" rx="2" fill="#4f9de0"/><circle cx="19" cy="21" r="2.6" fill="#fff"/><path d="M12 34l8-8 6 5 4-3 6 6z" fill="#2d6398"/>',
  zip: '<path d="M10 6h28v36H10z" rx="3" fill="#f3c64f" stroke="#c39218"/><path d="M22 6h4v20h-4z" fill="#a87c16"/><rect x="19" y="22" width="10" height="8" rx="1.5" fill="#fff" stroke="#a87c16"/>',
  txt: '<path d="M9 5h22l8 8v30H9z" fill="#fff" stroke="#cbd2da"/><path d="M31 5v8h8" fill="#e5e9ee"/><path d="M14 20h20M14 26h20M14 32h13" stroke="#8a96a3" stroke-width="2" stroke-linecap="round"/>',
  cad: '<path d="M9 5h22l8 8v30H9z" fill="#f8fafc" stroke="#bcc7d4"/><path d="M31 5v8h8" fill="#e2e8f0"/><circle cx="24" cy="27" r="7" fill="none" stroke="#3670a8" stroke-width="1.6"/><path d="M14 27h20M24 17v20" stroke="#7ea6cc" stroke-width="1.2"/>',
  pc: '<rect x="5" y="8" width="38" height="26" rx="2" fill="#1f8fe0" stroke="#bfe3ff" stroke-width="1.5"/><path d="M5 30h38" stroke="#0d5fa8" stroke-width="3"/><path d="M19 34l-2 6h14l-2-6z" fill="#9aa7b4"/>',
};
const APP_COLORS = ['#e8553e','#2f7de1','#18a058','#8b5cf6','#f59e0b','#0ea5a4','#db2777','#334155','#16a34a','#2563eb'];
function appSVG(name) {
  let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return `<rect x="5" y="5" width="38" height="38" rx="9" fill="${APP_COLORS[h % APP_COLORS.length]}"/><path d="M5 14a9 9 0 0 1 9-9h20a9 9 0 0 1 9 9v6H5z" fill="#fff" opacity=".14"/>` +
    `<text x="24" y="31.5" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,Arial" font-weight="700" font-size="18" fill="#fff">${[...name][0]}</text>`;
}
const glyphOf = (name, type) => type === 'app' ? appSVG(name) : SVG[type];

const FILES = [
  ['回收站','bin'], ['项目资料','folder'], ['2026 报价单.xlsx','xlsx'], ['产品需求.docx','docx'],
  ['截图_0927.png','png'], ['合同扫描件.pdf','pdf'], ['新建文件夹','folder'], ['设计素材','folder'],
  ['旅行照片','folder'], ['安装包.zip','zip'], ['会议纪要.docx','docx'], ['壁纸灵感','folder'],
  ['周报.xlsx','xlsx'], ['草图.png','png'], ['旧备份','folder'], ['微信图片.png','png'], ['说明书.pdf','pdf'], ['简历.docx','docx'], ['支出表.xlsx','xlsx'], ['压缩备份.zip','zip'], ['素材图.png','png'], ['下载','folder'], ['表情包.png','png'], ['工资条.xlsx','xlsx'], ['租房合同.pdf','pdf'], ['日记.docx','docx'], ['桌面截图.png','png'],
];
const EXTRA = [
  ['新建文本文档.txt','txt'], ['新建文件夹 (2)','folder'], ['发票.pdf','pdf'], ['数据导出.xlsx','xlsx'],
  ['截图_0928.png','png'], ['备忘.txt','txt'], ['归档.zip','zip'], ['新建文件夹 (3)','folder'],
];
const APPS = ['回收站','此电脑','微信','飞书','钉钉','腾讯会议','网易云音乐','剪映','Photoshop','Obsidian','VS Code','Krita',
  'AutoCAD','Rhino','KeyShot','百度网盘','Chrome','Blender','Figma','Notion','QQ','Steam','Eagle','OBS','Kimi','PureRef','EV录屏','NX 12.0','MarkText','Codex'];
const MISC = [['projects','folder'],['游戏','folder'],['todolist','folder'],['OKR管理.xlsx','xlsx'],['固定成本.xlsx','xlsx'],
  ['pdfarrange','app'],['stp.log','txt'],['零件.stp','txt'],['零件.3dm','png'],['预览','folder']];
const RIGHT = [['plot.log','txt'],['工具','folder'],['归档.rar','zip'],['1685x128.png','png'],['微信图片.jpg','png'],['0914.png','png'],
  ['微信图片 2.jpg','png'],['images.png','png'],['目录.docx','docx'],['api.txt','txt'],['c4ef.png','png'],['0918.png','png'],
  ['板调整.pdf','pdf'],['recommend.txt','txt'],['button.stp','txt'],['新建文本 (2).txt','txt'],['ugstep21','txt'],['新建文本 (3).txt','txt'],
  ['工作计划.txt','txt'],['微信图片 3.jpg','png'],['新建 DOCX.docx','docx'],['SEO.txt','txt'],['resend.txt','txt'],['产品介绍.txt','txt'],
  ['USER.pdf','pdf'],['新建文本.txt','txt'],['餐椅.pur','png'],['PAP-20.pdf','pdf'],['演示文稿.pptx','pdf'],['问题点.txt','txt']];
function mineCells() {
  const out = []; let a = 0, m = 0, rgt = 0, sh = 0;
  for (let c = 0; c < 3; c++) for (let r = 0; r < 10; r++) {
    const name = APPS[a++];
    out.push([c, r, name, name === '回收站' ? 'bin' : name === '此电脑' ? 'pc' : 'app']);
  }
  for (let r = 0; r < 10; r++) out.push([3, r, ...MISC[m++]]);
  for (let r = 0; r < 5; r++) out.push([5, r, `零件结构 ${r + 1}.dwg`, 'cad']);
  out.push([6, 0, '腿测试.bak', 'txt']);
  for (const [c, r] of [[6,4],[6,5],[6,6],[6,7],[6,8],[7,3],[7,4],[7,5],[7,6],[7,7],[8,4],[8,5],[8,6],[9,2],[9,3],[9,4],[9,5],[9,6]])
    out.push([c, r, `ScreenShot ${++sh}.png`, 'shot']);
  for (const [c, r] of [[11,1],[11,2],[11,3],[12,1],[12,2],[12,3],[12,4],[13,1],[13,2],[13,3],[13,4],[14,1],[14,3],[14,4],[15,1],[15,6],
    [16,4],[16,6],[17,4],[17,5],[17,6],[17,7],[19,4],[19,5],[19,8],[20,0],[20,4],[20,6],[21,0],[21,5],[21,6]]) {
    const f = RIGHT[rgt++ % RIGHT.length]; out.push([c, r, f[0], f[1]]);
  }
  return out;
}

/* ======================================================================
   CPU 噪声 + 可平铺噪声纹理
   ====================================================================== */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}

      for (let i = 0; i < want && all.length; i++) {
        for (let t = 0; t < 200; t++) {
          const c = rnd() < 0.65 ? Math.floor(rnd() * Math.min(4, grid.cols)) : Math.floor(rnd() * grid.cols);
          const pos = cellPos(c, Math.floor(rnd() * grid.rows));
          if (!occupied(pos.x, pos.y, null)) { addIcon(all[i % all.length], pos); break; }
        }
      }
    }
  } else if (kind === 'arranged') {
    FILES.forEach((f, i) => { const c = Math.floor(i / grid.rows), r = i % grid.rows; if (c < grid.cols) addIcon(f, cellPos(c, r)); });
  } else if (kind === 'messy') {
    const rnd = mulberry32(20260928);
    for (const f of FILES) for (let t = 0; t < 300; t++) {
      const c = rnd() < 0.45 ? Math.floor(rnd() * Math.min(3, grid.cols)) : Math.floor(rnd() * grid.cols);
      const pos = cellPos(c, Math.floor(rnd() * grid.rows));
      if (!occupied(pos.x, pos.y, null)) { addIcon(f, pos); break; }
    }
  } else {
    Array.from({ length: 10 }, (_, r) => [[0, r], [1, r]]).flat().concat([[2, 0], [2, 1], [2, 2], [3, 0], [3, 1], [3, 2], [Math.floor(grid.cols * 0.45), Math.floor(grid.rows * 0.5)]])
      .forEach(([c, r], i) => addIcon(FILES[i], cellPos(Math.min(c, grid.cols - 1), Math.min(r, grid.rows - 1))));
  }
  commit(true);
}

/* ======================================================================
   尺寸 / 主循环
   ====================================================================== */
function resize() {
  W = innerWidth; H = innerHeight;
  const scale = PREVIEW ? 0.45 : Math.min(devicePixelRatio || 1, P.quality);
  const box = cv.getBoundingClientRect();
  cv.width = Math.round((box.width || W) * scale);
  cv.height = Math.round((box.height || H) * scale);
  cv._scale = scale;
  Gw = Math.ceil(W / STEP) + 2;
  Gh = Math.ceil(H / STEP) + 2;
  buildNoise();
  allocField();
  if (typeof rebuildStrikeProps === 'function') rebuildStrikeProps();
}

const T0 = performance.now();
let lastT = 0, fpsEMA = 0, frameN = 0, frameMs = 0;
const px = new Uint8Array(4);
let paused = false;

let _rafId = 0;
function _scheduleFrame() { if (!paused && !_rafId) _rafId = requestAnimationFrame(frame); }
function _setPaused(v) {
  paused = !!v;
  if (paused) { if (_rafId) { cancelAnimationFrame(_rafId); _rafId = 0; } lastT = 0; }
  else _scheduleFrame();
}
function frame(now) {
  _rafId = 0;
  if (paused) { lastT = 0; return; }
  _scheduleFrame();
  if (P.cap30 && now - lastT < 31) return;
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.1) : 0.03;
  if (lastT) fpsEMA = fpsEMA ? fpsEMA * 0.9 + (1 / dt) * 0.1 : 1 / dt;
  lastT = now;
  const e = Math.min((now - morphT0) / morphDur, 1);
  curMix = e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
  const timeSec = (now - T0) / 1000;
  if (typeof stepStrikeProps === 'function') stepStrikeProps(dt, timeSec);
  draw(now);
  if (++frameN % 10 === 0) updateStats();
}

function draw(now) {
  const measure = !WALL && !PREVIEW && (frameN % 20 === 0), t0 = measure ? performance.now() : 0;
  const timeSec = (now - T0) / 1000;

  gl.useProgram(PR.p);
  gl.bindVertexArray(bgVAO);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, noiseTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, ftex[fromI]);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, ftex[toI]);
  const U = PR.U;
  gl.uniform1i(U.uNoise, 0); gl.uniform1i(U.uFA, 1); gl.uniform1i(U.uFB, 2);
  gl.uniform2f(U.uRes, cv.width / cv._scale, cv.height / cv._scale);
  gl.uniform2f(U.uGrid, Gw, Gh);
  gl.uniform1f(U.uScale, cv._scale);
  gl.uniform1f(U.uSeed, (seed % 997) * 0.37);
  gl.uniform1f(U.uStep, STEP);
  gl.uniform1f(U.uMix, curMix);
  gl.uniform1f(U.uTime, timeSec);
  gl.uniform1f(U.uHoles, P.holes);
  gl.uniform1f(U.uSmoke, P.smoke);
  gl.uniform1f(U.uWind, P.wind);
  gl.uniform1f(U.uDebug, P.debug ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  if (typeof drawStrikeProps === 'function') drawStrikeProps(timeSec);

  if (measure) { gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); frameMs = performance.now() - t0; }
}

/* ======================================================================
   面板 & 鼠标踢球交互
   ====================================================================== */
const statsEl = document.getElementById('stats');
const GPU = (() => {
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  const name = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  return name.replace(/^ANGLE \([^,]+,\s*/, '').replace(/\s*\(0x[0-9a-f]+\).*$/i, '')
    .replace(/\s*(Direct3D|vs_|OpenGL).*$/, '').replace(/\(R\)|\(TM\)/g, '').trim();
})();
function updateStats() {
  if (WALL || PREVIEW) return;
  const activeCrates = typeof crates !== 'undefined' ? crates.filter(t => t.want > 0.5).length : 0;
  statsEl.innerHTML =
    `<span class="live">● 动画中 · ${fpsEMA.toFixed(0)} fps</span><br>GPU ${GPU}<br>` +
    `单帧 ${frameMs.toFixed(1)} ms · 空地场 ${fieldMs.toFixed(0)} ms<br>` +
    `画布 ${cv.width}×${cv.height} · 掩体 ${activeCrates}`;
}
function syncPanel() {
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.v === layoutKind));
  document.querySelectorAll('.toggles input').forEach(inp => { inp.checked = P[inp.dataset.key]; });
}
const slidersEl = document.getElementById('sliders');
for (const s of SLIDERS) {
  const wrap = document.createElement('div');
  wrap.className = 'slider';
  wrap.innerHTML = `<div class="row"><span>${s.label}</span><span></span></div><input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${P[s.key]}">`;
  const out = wrap.querySelector('.row span:last-child'), inp = wrap.querySelector('input');
  out.textContent = s.fmt(P[s.key]);
  inp.addEventListener('input', () => {
    P[s.key] = +inp.value; out.textContent = s.fmt(P[s.key]);
    if (s.act === 'field') refresh();
    else if (s.act === 'rebuild' && typeof syncStrikeSettings === 'function') syncStrikeSettings(true);
    else if (s.act === 'props' && typeof syncStrikeSettings === 'function') syncStrikeSettings(false);
  });
  slidersEl.appendChild(wrap);
}
document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  applyLayout(b.dataset.v); syncPanel();
});
document.querySelectorAll('.toggles input').forEach(inp => inp.addEventListener('change', () => {
  P[inp.dataset.key] = inp.checked;
}));
document.getElementById('collapse').addEventListener('click', () => {
  const p = document.getElementById('panel');
  p.classList.toggle('collapsed');
  document.getElementById('collapse').textContent = p.classList.contains('collapsed') ? '+' : '–';
});
let iconsSeen = !(WALL || PREVIEW);
function reseed(v) {
  seed = v; buildNoise(); buildNoiseTex();
  if (typeof rebuildStrikeProps === 'function') rebuildStrikeProps();
  if (!iconsSeen) return;
  commit(true);
}
document.getElementById('btnSeed').addEventListener('click', () => reseed((Math.random() * 1e6) | 0));
document.getElementById('btnAdd').addEventListener('click', () => {
  const f = EXTRA[extraIdx++ % EXTRA.length];
  let pos = null;
  for (let t = 0; t < 300 && !pos; t++) {
    const c = cellPos(Math.floor(Math.random() * grid.cols), Math.floor(Math.random() * grid.rows));
    if (!occupied(c.x, c.y, null)) pos = c;
  }
  if (!pos) return;
  const ic = addIcon(f, pos, true);
  select(ic);
  commit();
});
desktop.addEventListener('pointerdown', e => {
  select(null);
  if (typeof strikePointerKick === 'function') strikePointerKick(e.clientX, e.clientY, 0, 0);
});
let lastPtr = { x: 0, y: 0, t: 0 };
desktop.addEventListener('pointermove', e => {
  if (drag || typeof strikePointerKick !== 'function') return;
  const now = performance.now();
  const dt = Math.max(0.01, (now - lastPtr.t) / 1000);
  if (now - lastPtr.t > 24) {
    strikePointerKick(e.clientX, e.clientY, (e.clientX - lastPtr.x) / dt * 0.35, (e.clientY - lastPtr.y) / dt * 0.35);
    lastPtr = { x: e.clientX, y: e.clientY, t: now };
  }
});
addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected) {
    const ic = selected; select(null); ic.el.remove(); icons = icons.filter(x => x !== ic); commit();
  } else if (e.key === 'h' || e.key === 'H') document.getElementById('panel').classList.toggle('hidden');
});
let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (WALL || PREVIEW) { resize(); refresh(); return; }
    resize(); computeGrid();
    if (grid.cols * grid.rows > layoutCapacity && layoutCapacity < 40) { applyLayout(layoutKind); syncPanel(); return; }
    for (const ic of icons) setPos(ic, Math.min(ic.x, Math.max(0, DW - ic.w)), Math.min(ic.y, Math.max(0, DH - ic.h)));
    refresh();
  }, 100);
});
function tickClock() {
  const d = new Date(), z = n => String(n).padStart(2, '0');
  document.getElementById('clock').innerHTML = `${z(d.getHours())}:${z(d.getMinutes())}<br>${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}
setInterval(tickClock, 15000); tickClock();

/* ---------- 启动 ---------- */
window.__dbg = {
  P, applyLayout,
  kickBall(x, y) { return typeof strikePointerKick === 'function' ? strikePointerKick(x, y, 220, -140) : false; },
  bench() {
    const ts = [];
    for (let i = 0; i < 10; i++) { const a = performance.now(); draw(performance.now()); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); ts.push(performance.now() - a); }
    ts.sort((a, b) => a - b);
    return { frame: +ts[5].toFixed(1), canvas: cv.width + 'x' + cv.height, gpu: GPU };
  },
};
/* Startup runs after external prop & share scripts finish loading */

/* ======================================================================
   托管模式：壁纸模式 (?wallpaper=1) & 预览模式 (?preview=1)
   ====================================================================== */
function applySettings(v) {
  if (typeof v.seed === 'number' && v.seed !== seed) reseed(v.seed);
  let field = false, propsChanged = false, rebuildChanged = false, adaptiveChanged = false;
  for (const k in v) {
    if ((!SLIDERS.some(s => s.key === k) && !DISPLAY_KEYS.includes(k)) || typeof v[k] !== typeof P[k] || P[k] === v[k]) continue;
    if (DISPLAY_KEYS.includes(k) && v[k] !== 0 && v[k] !== 1) continue;
    P[k] = v[k];
    if (k === 'adaptive') adaptiveChanged = true;
    if (k === 'sigma' || k === 'warp') field = true;
    if (k === 'crates') rebuildChanged = true;
    if (k === 'holes' || k === 'smoke' || k === 'ball' || k === 'chickens') propsChanged = true;
  }
  if (adaptiveChanged && FB) commit();
  else if (field && FB) refresh();
  if ((rebuildChanged || propsChanged) && FB && typeof syncStrikeSettings === 'function') {
    syncStrikeSettings(rebuildChanged);
  }
}

function drawGhosts() {
  const box = document.getElementById('ghosts');
  box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}

function startHostedMode() {
  document.body.classList.add('wall');
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  icons = [];
  commit(true);
  let first = true;
  const handle = m => {
    if (m.t === 'pause') { _setPaused(PREVIEW ? false : m.v); return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    commit(first);
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => handle(JSON.parse(ev.data)));
  host.postMessage('ready');
}
</script>
<script src="strike-props.js"></script>
<script src="share.js"></script>
<script>
resize();
buildNoiseTex();
if (WALL || PREVIEW) startHostedMode();
else { applyLayout('mine'); syncPanel(); }
_scheduleFrame();
</script>
</body>
